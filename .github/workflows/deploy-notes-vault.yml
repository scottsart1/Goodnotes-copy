name: Deploy notes vault

on:
  push:
    branches: [main]
    paths:
      - "web/notes-vault/**"
      - ".github/workflows/deploy-notes-vault.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-notes-vault
  cancel-in-progress: false

jobs:
  # Secrets cannot be used in a job-level `if`, so this tiny job reports whether the
  # Cloudflare token is configured; without it the deploy job is skipped (e.g. on forks).
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.token.outputs.enabled }}
    steps:
      - id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the notes vault deploy."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/notes-vault
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/notes-vault/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTES_PASSWORD: ${{ secrets.NOTES_PASSWORD }}
          NOTES_LINK_ID: ${{ secrets.NOTES_LINK_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: bash scripts/deploy.sh
